<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Divine Trails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }
        .admin-sidebar {
            width: 260px;
            background: #00332B;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .admin-sidebar .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            margin-bottom: 30px;
            color: #FF9933;
        }
        .admin-tab-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            padding: 12px 16px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-tab-btn.active, .admin-tab-btn:hover {
            background: rgba(255,153,51,0.2);
            color: #FF9933;
        }
        .admin-content {
            flex: 1;
            padding: 30px;
            background: #FDFBF7;
        }
        .admin-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #E5E0D5;
        }
        .metric-card span {
            font-size: 2rem;
            font-weight: 700;
            color: #004D40;
        }
        .admin-tab-content {
            display: none;
        }
        .admin-tab-content.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid #E5E0D5;
            font-size: 0.9rem;
        }
        th {
            background: #F5F2EB;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="logo"><i class="fa-solid fa-om"></i> Admin Portal</div>
            <button class="admin-tab-btn active" data-tab="tab-packages"><i class="fa-solid fa-compass"></i> Packages</button>
            <button class="admin-tab-btn" data-tab="tab-bookings"><i class="fa-solid fa-suitcase"></i> Bookings</button>
            <div style="margin-top: auto;">
                <button id="admin-logout-btn" class="admin-tab-btn" style="color:#ff6b6b;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </aside>

        <main class="admin-content">
            <div class="admin-metrics">
                <div class="metric-card">
                    <p style="color:#666; margin:0 0 4px 0;">Active Packages</p>
                    <span id="stat-active-packages">0</span>
                </div>
                <div class="metric-card">
                    <p style="color:#666; margin:0 0 4px 0;">Total Bookings</p>
                    <span id="stat-total-bookings">0</span>
                </div>
                <div class="metric-card">
                    <p style="color:#666; margin:0 0 4px 0;">Estimated Revenue</p>
                    <span id="stat-revenue">₹0</span>
                </div>
            </div>

            <!-- Tab Packages -->
            <div id="tab-packages" class="admin-tab-content active">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2>Manage Yatra Packages</h2>
                    <button id="btn-add-package" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Package</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Package</th>
                            <th>Price</th>
                            <th>Badge</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-packages-list"></tbody>
                </table>
            </div>

            <!-- Tab Bookings -->
            <div id="tab-bookings" class="admin-tab-content">
                <h2>All Bookings</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Ref ID</th>
                            <th>Pilgrim</th>
                            <th>Package</th>
                            <th>Travelers</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="admin-bookings-list"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay"></div>

    <div id="admin-pkg-modal" class="modal">
        <button class="modal-close"><i class="fa-solid fa-xmark"></i></button>
        <h2>Package Editor</h2>
        <form id="admin-package-form" style="margin-top:16px;">
            <input type="hidden" id="pkg-form-id">
            <div class="form-group">
                <label for="pkg-form-title">Package Title</label>
                <input type="text" id="pkg-form-title" required>
            </div>
            <div class="form-group">
                <label for="pkg-form-location">Location</label>
                <input type="text" id="pkg-form-location" required>
            </div>
            <div class="form-row">
                <div class="form-group half">
                    <label for="pkg-form-price">Price</label>
                    <input type="text" id="pkg-form-price" placeholder="₹18,500" required>
                </div>
                <div class="form-group half">
                    <label for="pkg-form-duration">Duration</label>
                    <input type="text" id="pkg-form-duration" placeholder="5 Days / 4 Nights" required>
                </div>
            </div>
            <div class="form-group">
                <label for="pkg-form-image">Image URL</label>
                <input type="url" id="pkg-form-image" required>
            </div>
            <div class="form-group">
                <label for="pkg-form-badge">Badge (e.g. Popular, Sacred)</label>
                <input type="text" id="pkg-form-badge">
            </div>
            <button type="submit" class="btn btn-primary full-width">Save Package</button>
        </form>
    </div>

    <script type="module" src="/src/pages/admin.js"></script>
</body>
</html>
